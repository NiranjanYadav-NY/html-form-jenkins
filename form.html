<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .form-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(30, 64, 175, 0.12);
        }

        h1 {
            color: #172554;
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            width: 100%;
            margin-top: 26px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        button:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
            color: #166534;
        }

        #message:empty {
            display: none;
        }

        @media (max-width: 480px) {
            .form-card {
                padding: 24px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="form-card">
        <h1>Contact Us</h1>

        <p class="subtitle">
            Have a question? Fill out the form below
            and we will be happy to hear from you.
        </p>

        <form id="contactForm" action="#" method="post">

            <label for="name">Full Name</label>
            <input
                id="name"
                name="name"
                type="text"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

            <label for="email">Email Address</label>
            <input
                id="email"
                name="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <label for="contact">Contact Number</label>
            <input
                id="contact"
                name="contact"
                type="tel"
                placeholder="Enter your phone number"
                autocomplete="tel"
                pattern="[0-9+() -]{7,20}"
                title="Enter 7 to 20 characters using digits, spaces, +, parentheses, or hyphens."
                required
            >

            <button type="submit">Submit Form</button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>
    </main>

    <script>
        // Validate the form locally without sending personal data.
        const contactForm = document.getElementById("contactForm");
        const message = document.getElementById("message");

        contactForm.addEventListener("submit", function (event) {
            event.preventDefault();

            if (!contactForm.checkValidity()) {
                contactForm.reportValidity();
                return;
            }

            message.textContent = "Form validated successfully!";
        });
    </script>

</body>
</html>
